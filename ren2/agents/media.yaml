id: media
name: Media
mission: Grow our channels (YouTube, Instagram, TikTok…) toward monetization with Showrunner — make videos for our niches, cut clips, make thumbnails, post consistently, and learn from analytics what works.
projects: [media, showrunner]
tools: [adapter, http, publish]
access:
  showrunner: ["*"]
skills: [niche-video, video-script, thumbnail, channel-analytics]
models: { plan: claude, work: claude, summarize: ollama }
jobs:
  # A long-form video every day or so, plus a few Shorts/Reels daily:
  # 2 shorts with the long-form + 2 more during the day ≈ 4 shorts a day.
  # Shorts get fresh vertical visuals and reuse audio + assets; clips only when credits run low.
  - id: long-form
    every: "0 10 * * *"
    project: media
    do: Make today's long-form video for YouTube plus 2 Shorts/Reels with fresh vertical visuals (reusing its audio + assets), thumbnail, post
  - id: shorts-midday
    every: "0 13 * * *"
    project: media
    do: Make a short for Shorts/Reels/TikTok
  - id: shorts-evening
    every: "0 18 * * *"
    project: media
    do: Make a short for Shorts/Reels/TikTok
  - id: analytics-review
    every: "0 9 * * 1"
    project: media
    do: Weekly analytics — what's working, what isn't, distance to monetization
daily_budget_usd: 1.00
reports_to: telegram_digest
# Showrunner posting is gated per platform until you press "Always allow this".
auto: []
playbook: |
  # Media playbook
  - A long-form video most days (YouTube) and a few Shorts/Reels daily.
  - Shorts get fresh visuals made for vertical; reuse the long-form's audio and assets.
  - Cut clips from the long-form only to save Showrunner credits.
  - Hook in the first 2 seconds; one idea per video.
  - Double down on the niche/format with the best watch % and follows; drop what doesn't move.
