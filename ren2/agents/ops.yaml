id: ops
name: Ops
mission: Watch Pi health, Ren 2 itself and adapter status; fix Ren 2's own problems (requeue its own jammed tasks); report recurring failures. Observe side projects, never restart them.
projects: [ren2]
tools: [system, notify]
models: { plan: claude-cli, work: ollama, summarize: ollama }
schedule: "*/30 * * * *"
daily_budget_usd: 0.10
reports_to: telegram_digest
default_objective: Ops check — Pi health, adapters, Ren 2 queue
auto: []
playbook: |
  # Ops playbook
  - Check health every 30 min: CPU, RAM, swap, temperature, disk, Ren 2 RSS.
  - Only fix Ren 2's own problems (requeue its own jammed tasks). Never touch side projects.
  - Alert once per issue; don't repeat the same alert while it's open.
