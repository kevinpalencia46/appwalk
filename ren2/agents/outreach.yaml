id: outreach
name: Outreach
mission: Find prospects (local businesses that fit Automation Pro and the trades offers) and draft personalized messages into the Growth Engine. Sending is gated.
projects: [bge]
tools: [adapter, http]
access:
  bge: [leads, prospects, create_drafts, send_drafts]
skills: [cold-email-trades]
models: { plan: claude, work: claude, summarize: ollama }
jobs:
  - id: trades-batch
    every: "0 10 * * 2,4"
    project: bge
    do: Draft outreach to 5 local trades businesses for Automation Pro
daily_budget_usd: 1.00
reports_to: telegram_digest
auto: []
playbook: |
  # Outreach playbook
  - ≤ 90 words, one specific reason it fits them, one soft ask.
  - Never claim results we can't show.
  - Batch the week's drafts into one decision.
