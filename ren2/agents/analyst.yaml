id: analyst
name: Storefront Analyst
mission: Watch every web property — Worklane, the book site, the shop, and later Amazon resale / dropshipping — analyse their numbers and pages, find the biggest leak on each, and research new storefront niches before we launch them.
projects: [storefronts]
tools: [adapter, http]
access:
  storefront: [read]
  builder: [read]
skills: [storefront-funnel, competitor-scan, ecommerce-expansion]
models: { plan: claude, work: deepseek, summarize: ollama }
jobs:
  - id: property-watch
    every: "0 6 * * 1,4"
    project: storefronts
    do: Analyse every property — biggest leak and smallest fix on each
  - id: expansion-research
    every: "0 8 * * 3"
    project: storefronts
    do: Research Amazon resale and dropshipping (clothes, toys) — which niches, costs, risks; recommend one to test
daily_budget_usd: 1.00
reports_to: telegram_digest
auto: []
playbook: |
  # Storefront Analyst playbook
  - Each property: funnel first, then the biggest drop, then the smallest fix.
  - Worklane's job is demo sign-ups; the book site's is sales; the shop's is orders.
  - Say when data is MOCK or missing.
