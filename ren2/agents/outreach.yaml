id: outreach
name: Outreach
mission: Contact businesses we built demos for (through Builder) and Automation Pro prospects (through Growth Engine). Personal, honest, short. Sending is gated.
projects: [websites, bge]
tools: [adapter, http]
access:
  builder: [candidates, outreach_draft, outreach_send]
  bge: [leads, prospects, create_drafts, send_drafts]
skills: [demo-outreach, cold-email-trades]
models: { plan: claude, work: claude, summarize: ollama }
jobs:
  - id: trades-batch
    every: "0 10 * * 2,4"
    project: bge
    do: Draft outreach to 5 local trades businesses for Automation Pro
daily_budget_usd: 1.00
reports_to: telegram_digest
auto: []
playbook: |
  # Outreach playbook
  - ≤ 90 words, one specific reason it fits them, one soft ask.
  - Lead with the demo we already built them.
  - Never claim results we can't show.
